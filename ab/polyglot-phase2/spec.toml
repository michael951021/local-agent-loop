te message with it.\n\nImplement it in `exercises/tree-building/tree_building.py` (it has the stubs). The tests are in `exercises/tree-building/tree_building_test.py`; run them with:\n\n    cd exercises/tree-building && python3 -m unittest discover -p '*_test.py'\n\nKeep the existing function and class names: the tests import them. Use only the Python standard library.\nWork only in `exercises/tree-building/`."
